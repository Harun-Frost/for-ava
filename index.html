<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>For Ava</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div id="live-announcer" class="visually-hidden" aria-live="polite"></div>

  <!-- Minimalist Passcode Gate -->
  <section
    id="passcode-gate"
    class="gate-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="gate-title"
  >
    <div class="gate-ambient" aria-hidden="true"></div>
    <div class="gate-card frosted-glass">
      <h1 id="gate-title" class="font-editorial-alt gate-title">For Ava</h1>

      <form id="gate-form" class="gate-form" novalidate>
        <div class="field">
          <label for="passcode-input" class="field-label">Passcode</label>
          <span id="passcode-hint" class="field-hint">Enter the 4-digit passcode</span>

          <div class="input-row">
            <input
              id="passcode-input"
              name="passcode"
              type="password"
              inputmode="numeric"
              pattern="\d{4}"
              maxlength="4"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
              enterkeyhint="done"
              required
              aria-describedby="passcode-hint"
              data-error="passcode-error"
              aria-invalid="false"
            >
            <button
              id="toggle-passcode"
              type="button"
              class="icon-btn"
              aria-pressed="false"
              aria-label="Show passcode"
            >
              <svg class="icon-eye" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon-eye-off" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" hidden>
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a21.8 21.8 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a21.8 21.8 0 0 1-2.16 3.19" />
                <path d="M1 1l22 22" />
              </svg>
            </button>
          </div>

          <div id="passcode-error" class="error-msg">
            <span role="img" aria-label="Error">!</span>
            <span id="passcode-error-text">Please enter the 4-digit passcode.</span>
          </div>
        </div>

        <button id="unlock-btn" type="submit" class="submit-btn">Open</button>
      </form>
    </div>
  </section>

  <!-- Pure Bouquet View (inert until unlocked) -->
  <main id="main-content" class="bouquet-screen" tabindex="-1" inert>
    <div class="hero-backdrop" aria-hidden="true"></div>
    <canvas id="pollen-canvas" class="pollen-canvas" aria-hidden="true"></canvas>

    <div class="bouquet-layout">
      <figure class="bouquet-stage">
        <svg
          id="bouquet-svg"
          class="bouquet-svg"
          viewBox="0 0 600 640"
          role="img"
          aria-label="A minimalist blooming bouquet of blush roses, ivory peonies, ranunculus, eucalyptus leaves, and baby's breath tied with a champagne ribbon"
        >
          <title>A bouquet of flowers blooming for Ava</title>
          <defs>
            <radialGradient id="glow-pearl" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#f7d6dc" stop-opacity="0.22" />
              <stop offset="60%" stop-color="#d4a5a5" stop-opacity="0.06" />
              <stop offset="100%" stop-color="#050505" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="stem-grad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#354a3c" />
              <stop offset="100%" stop-color="#6f8f77" />
            </linearGradient>
            <linearGradient id="ribbon-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f5e6d3" />
              <stop offset="50%" stop-color="#d9be9d" />
              <stop offset="100%" stop-color="#b69874" />
            </linearGradient>
            <radialGradient id="petal-rose" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#fde4e8" />
              <stop offset="55%" stop-color="#e59eb0" />
              <stop offset="100%" stop-color="#9e5669" />
            </radialGradient>
            <radialGradient id="petal-peony" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#fff8f9" />
              <stop offset="60%" stop-color="#f6ccd5" />
              <stop offset="100%" stop-color="#cf8799" />
            </radialGradient>
            <radialGradient id="petal-champagne" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#fff6ef" />
              <stop offset="60%" stop-color="#efd0c2" />
              <stop offset="100%" stop-color="#c28e7d" />
            </radialGradient>
          </defs>

          <circle cx="300" cy="285" r="245" fill="url(#glow-pearl)" />
          <g id="bouquet-stems"></g>
          <g id="bouquet-foliage"></g>
          <g id="bouquet-babysbreath"></g>
          <g id="bouquet-flowers"></g>
          <g id="bouquet-ribbon"></g>
        </svg>
      </figure>

      <h1 class="hero-dedication font-editorial-alt">I love you, Ava.</h1>

      <div class="minimal-controls">
        <button id="rebloom-btn" type="button" class="pill-action">Rebloom</button>
        <button id="motion-toggle-btn" type="button" class="pill-action">Pause motion</button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="app.js?v=2" defer></script>
</body>
</html>
